<!DOCTYPE html>
<html>

<head>

<title>Luxury Medical Group Booking</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    background:#020617;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding-top:80px;
}

h1 {
    color:#b89a5a;
    font-size:48px;
}

h2 {
    font-size:32px;
}

#timezone {
    margin-top:30px;
    font-size:20px;
}

#booking {
    margin-top:50px;
    font-size:22px;
}

</style>

</head>


<body>

<h1>Luxury Medical Group</h1>

<h2>Book Your Free Peptide Consultation</h2>


<p id="timezone">
Checking your location...
</p>


<div id="booking">
Loading available appointments...
</div>



<script>

const timezone =
Intl.DateTimeFormat().resolvedOptions().timeZone;


document.getElementById("timezone").innerHTML =
`
Your local timezone:
<strong>${timezone}</strong>
`;


document.getElementById("booking").innerHTML =
`
We detected your timezone automatically.
<br><br>
Next we will load available appointments.
`;


</script>


</body>

</html>
