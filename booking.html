<!DOCTYPE html>
<html>

<head>

<title>Luxury Medical Group Booking</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body {
    background:#020617;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding-top:80px;
}

h1 {
    color:#b89a5a;
    font-size:48px;
}

h2 {
    font-size:32px;
}

#timezone {
    margin-top:30px;
    font-size:20px;
}

#booking {
    margin-top:50px;
    font-size:22px;
}

</style>

</head>


<body>

<h1>Luxury Medical Group</h1>

<h2>Book Your Free Peptide Consultation</h2>


<p id="timezone">
Checking your location...
</p>


<div id="booking">
Loading available appointments...
</div>



<script>

const timezone =
Intl.DateTimeFormat().resolvedOptions().timeZone;


document.getElementById("timezone").innerHTML =
`
Your local timezone:
<strong>${timezone}</strong>
`;



fetch("https://luxury-booking-api.vercel.app/api/booking")

.then(response => response.json())

.then(data => {


const categories =
data.data.createCart.cart.availableCategories;


let html = "";


categories.forEach(category => {


html += `<h3>${category.name}</h3>`;


category.availableItems.forEach(item => {

html += `

<div style="
margin:20px;
padding:30px;
border:1px solid #b89a5a;
border-radius:15px;
">

<h2>${item.name}</h2>

<p>
Ready to schedule your consultation?
</p>

<button 
onclick="bookService('${item.id}')"
style="
background:#b89a5a;
border:none;
padding:15px 30px;
border-radius:25px;
font-size:18px;
cursor:pointer;
">
Book This Consultation
</button>

</div>

`;

});


document.getElementById("booking").innerHTML = html;


})


.catch(error => {

console.error("BOULEVARD ERROR:", error);

document.getElementById("booking").innerHTML =
`
<h3>Booking Error</h3>
<pre>${error}</pre>
`;

});


function selectService(serviceId){

console.log("Selected Service:", serviceId);


document.getElementById("booking").innerHTML =

`
<h2>Loading available appointments...</h2>

<p>
Service:
${serviceId}
</p>

`;

}
function bookService(serviceId){

const timezone =
Intl.DateTimeFormat().resolvedOptions().timeZone;


const url =
`https://www.joinblvd.com/b/luxurymedicalgroup/widget#/visit-type?locationId=67044558-0bab-4c70-adc8-d7d627da6525&serviceId=${serviceId}&timezone=${timezone}`;


window.open(url,"_blank");

}
</script>


</body>

</html>
