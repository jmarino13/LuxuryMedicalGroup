<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Medical Group | Concierge GLP-1 & Peptide Therapy in Denver</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Luxury Medical Group is a concierge-style wellness clinic in Denver, Colorado specializing in GLP-1 weight management and peptide therapies.">
  <style>
    :root {
      --bg: #0f1115;          /* main background */
      --bg-alt: #181b22;      /* section background */
      --accent: #c29a52;      /* gold accent (adjust to logo) */
      --accent-soft: #d7b878;
      --text: #f5f4f1;
      --muted: #b9bcc4;
      --danger: #e76c6c;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 18px 40px rgba(0,0,0,0.45);
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f222b 0, var(--bg) 48%);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--accent-soft);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(12px);
      background: rgba(10, 10, 12, 0.88);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .nav {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .logo img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #ffffff 0, #d3d3d3 28%, #888 70%, #000 100%);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-text span:first-child {
      font-weight: 650;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    .logo-text span:last-child {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      font-size: 0.9rem;
    }

    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      position: relative;
      padding-bottom: 2px;
    }

    .nav-links a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 0;
      height: 1px;
      background: var(--accent-soft);
      transition: width 0.2s ease-out;
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-cta {
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: linear-gradient(130deg, var(--accent), var(--accent-soft));
      border: none;
      color: #141414;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
      white-space: nowrap;
    }

    .nav-cta:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
    }

    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.2rem 0.7rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(10,10,12,0.8);
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #7cf0c8;
      box-shadow: 0 0 0 4px rgba(124,240,200,0.25);
    }

    .pill span:nth-child(2) {
      color: var(--accent-soft);
      font-weight: 600;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.7fr);
      gap: 2.5rem;
      align-items: center;
      padding: 2.5rem 2rem;
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at top left, rgba(194,154,82,0.25), transparent 55%),
                  radial-gradient(circle at bottom, rgba(24,27,34,0.9), #050608);
      box-shadow: var(--shadow-soft);
      margin-top: 1.5rem;
    }

    .hero h1 {
      margin-top: 1.1rem;
      font-size: clamp(2.1rem, 3vw, 2.65rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .hero h1 span {
      color: var(--accent-soft);
    }

    .hero-sub {
      margin-top: 0.9rem;
      color: var(--muted);
      font-size: 0.98rem;
      max-width: 30rem;
    }

    .hero-sub strong {
      color: var(--text);
      font-weight: 600;
    }

    .hero-meta {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.9rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .hero-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .hero-meta svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .hero-cta-row {
      margin-top: 1.8rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
    }

    .btn-primary {
      padding: 0.7rem 1.5rem;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-soft));
      color: #141414;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 38px rgba(0,0,0,0.6);
    }

    .btn-ghost {
      padding: 0.7rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: transparent;
      color: var(--muted);
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-ghost svg {
      width: 15px;
      height: 15px;
    }

    .hero-note {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    .hero-right {
      border-radius: var(--radius-lg);
      background: radial-gradient(circle at 10% 0, rgba(255,255,255,0.18), transparent 60%),
                  linear-gradient(160deg, #1a1d24, #050608);
      padding: 1.5rem 1.4rem;
